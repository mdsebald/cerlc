name: Erlang CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    container:
      image: erlang:29.1.2

    steps:
    - uses: actions/checkout@v2
    - name: Compile
      run: rebar3 compile
    - name: Run tests
      run: rebar3 eunit
    - name: Build documentation
      run: rebar3 ex_doc --output _build/docs
    - name: Build Hex package
      run: rebar3 hex build package
    - name: Run Dialyzer
      run: rebar3 dialyzer
